<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#00D4AA" stroke="#00A080" stroke-width="3"/>
  
  <!-- VRM character silhouette -->
  <g fill="#FFFFFF">
    <!-- Head -->
    <circle cx="64" cy="45" r="18"/>
    
    <!-- Body -->
    <path d="M 46 63 Q 46 75 50 85 L 50 95 L 56 95 L 56 85 Q 56 75 64 75 Q 72 75 72 85 L 72 95 L 78 95 L 78 85 Q 82 75 82 63 Z"/>
    
    <!-- Arms -->
    <ellipse cx="40" cy="75" rx="6" ry="15" transform="rotate(-20 40 75)"/>
    <ellipse cx="88" cy="75" rx="6" ry="15" transform="rotate(20 88 75)"/>
    
    <!-- Eyes -->
    <circle cx="58" cy="42" r="3" fill="#00A080"/>
    <circle cx="70" cy="42" r="3" fill="#00A080"/>
    
    <!-- Smile -->
    <path d="M 56 50 Q 64 54 72 50" fill="none" stroke="#00A080" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- VRM badge -->
  <g transform="translate(85, 95)">
    <rect x="-18" y="-12" width="36" height="24" rx="4" fill="#FF6B9D" stroke="#CC5680" stroke-width="2"/>
    <text x="0" y="2" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">VRM</text>
  </g>
  
  <!-- Camera/streaming icon in corner -->
  <g transform="translate(15, 15)">
    <circle cx="0" cy="0" r="12" fill="#FF4444" opacity="0.9"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
    <circle cx="2" cy="-2" r="2" fill="#FF4444"/>
  </g>
</svg>