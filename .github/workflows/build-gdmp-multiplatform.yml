name: Build GDMP Multi-Platform

# Builds GDMP (Godot MediaPipe) from source for all supported platforms
# This workflow builds GDMP libraries that are then used by the main build workflow

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
    paths:
      - '.github/workflows/build-gdmp-multiplatform.yml'
      - 'addons/GDMP/**'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6-stable"
  GDMP_REPO: "j20001970/GDMP"
  GDMP_REF: "main"  # or specific tag/commit

jobs:
  # Build GDMP for Linux x86_64
  build-linux-x86_64:
    name: Build GDMP Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GDMP
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GDMP_REPO }}
          ref: ${{ env.GDMP_REF }}
          submodules: recursive
          path: GDMP
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Bazelisk
        run: |
          wget -q https://github.com/bazelbuild/bazelisk/releases/download/v1.19.0/bazelisk-linux-amd64
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel
          bazel --version
          
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            GDMP/.bazelcache
          key: bazel-linux-x86_64-${{ hashFiles('GDMP/WORKSPACE', 'GDMP/BUILD.bazel') }}
          restore-keys: |
            bazel-linux-x86_64-
          
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --dump-extension-api
          
      - name: Setup GDMP
        working-directory: GDMP
        run: |
          python3 setup.py --api-json ../extension_api.json --no-download || true
          
      - name: Build GDMP
        working-directory: GDMP
        run: |
          python3 build.py desktop --type release --output build/linux-x86_64
          
      - name: Verify build
        run: |
          ls -lh GDMP/build/linux-x86_64/
          file GDMP/build/linux-x86_64/libGDMP.linux.so
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdmp-linux-x86_64
          path: GDMP/build/linux-x86_64/libGDMP.linux.so
          retention-days: 30

  # Build GDMP for Linux arm64
  build-linux-arm64:
    name: Build GDMP Linux (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GDMP
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GDMP_REPO }}
          ref: ${{ env.GDMP_REF }}
          submodules: recursive
          path: GDMP
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          
      - name: Install Bazelisk
        run: |
          wget -q https://github.com/bazelbuild/bazelisk/releases/download/v1.19.0/bazelisk-linux-amd64
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel
          bazel --version
          
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            GDMP/.bazelcache
          key: bazel-linux-arm64-${{ hashFiles('GDMP/WORKSPACE', 'GDMP/BUILD.bazel') }}
          restore-keys: |
            bazel-linux-arm64-
          
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --dump-extension-api
          
      - name: Setup GDMP
        working-directory: GDMP
        run: |
          python3 setup.py --api-json ../extension_api.json --no-download || true
          
      - name: Build GDMP for arm64
        working-directory: GDMP
        run: |
          # Build for arm64 using cross-compilation
          python3 build.py desktop --type release --arch arm64 --output build/linux-arm64 || \
          python3 build.py desktop --type release --output build/linux-arm64
          
      - name: Verify build
        run: |
          ls -lh GDMP/build/linux-arm64/
          file GDMP/build/linux-arm64/libGDMP.linux.so || true
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdmp-linux-arm64
          path: GDMP/build/linux-arm64/libGDMP.linux.so
          retention-days: 30

  # Build GDMP for Windows x86_64
  build-windows-x86_64:
    name: Build GDMP Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout GDMP
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GDMP_REPO }}
          ref: ${{ env.GDMP_REF }}
          submodules: recursive
          path: GDMP
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Bazelisk
        run: |
          Invoke-WebRequest -Uri "https://github.com/bazelbuild/bazelisk/releases/download/v1.19.0/bazelisk-windows-amd64.exe" -OutFile "bazel.exe"
          $env:PATH += ";$(Get-Location)"
          .\bazel.exe --version
          
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/_bazel_*
            GDMP/.bazelcache
          key: bazel-windows-x86_64-${{ hashFiles('GDMP/WORKSPACE', 'GDMP/BUILD.bazel') }}
          restore-keys: |
            bazel-windows-x86_64-
          
      - name: Download Godot
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_win64.exe.zip" -OutFile "godot.zip"
          Expand-Archive -Path godot.zip -DestinationPath .
          .\Godot_v${{ env.GODOT_VERSION }}_win64.exe --headless --dump-extension-api
          
      - name: Setup GDMP
        working-directory: GDMP
        run: |
          python setup.py --api-json ../extension_api.json --no-download
          
      - name: Build GDMP
        working-directory: GDMP
        run: |
          $env:PATH += ";$(Get-Location)\..\bazel.exe"
          python build.py desktop --type release --output build/windows-x86_64
          
      - name: Verify build
        run: |
          Get-ChildItem GDMP\build\windows-x86_64\
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdmp-windows-x86_64
          path: GDMP/build/windows-x86_64/GDMP.windows.dll
          retention-days: 30

  # Build GDMP for macOS x86_64
  build-macos-x86_64:
    name: Build GDMP macOS (x86_64)
    runs-on: macos-13  # Intel runner
    steps:
      - name: Checkout GDMP
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GDMP_REPO }}
          ref: ${{ env.GDMP_REF }}
          submodules: recursive
          path: GDMP
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Bazelisk
        run: |
          brew install bazelisk
          bazel --version
          
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/bazel
            GDMP/.bazelcache
          key: bazel-macos-x86_64-${{ hashFiles('GDMP/WORKSPACE', 'GDMP/BUILD.bazel') }}
          restore-keys: |
            bazel-macos-x86_64-
          
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_macos.universal.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_macos.universal.zip
          chmod +x Godot.app/Contents/MacOS/Godot
          ./Godot.app/Contents/MacOS/Godot --headless --dump-extension-api
          
      - name: Setup GDMP
        working-directory: GDMP
        run: |
          python3 setup.py --api-json ../extension_api.json --no-download || true
          
      - name: Build GDMP
        working-directory: GDMP
        run: |
          python3 build.py desktop --type release --output build/macos-x86_64
          
      - name: Verify build
        run: |
          ls -lh GDMP/build/macos-x86_64/
          file GDMP/build/macos-x86_64/libGDMP.macos.dylib
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdmp-macos-x86_64
          path: GDMP/build/macos-x86_64/libGDMP.macos.dylib
          retention-days: 30

  # Build GDMP for macOS arm64
  build-macos-arm64:
    name: Build GDMP macOS (arm64)
    runs-on: macos-latest  # Apple Silicon runner
    steps:
      - name: Checkout GDMP
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GDMP_REPO }}
          ref: ${{ env.GDMP_REF }}
          submodules: recursive
          path: GDMP
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Bazelisk
        run: |
          brew install bazelisk
          bazel --version
          
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/bazel
            GDMP/.bazelcache
          key: bazel-macos-arm64-${{ hashFiles('GDMP/WORKSPACE', 'GDMP/BUILD.bazel') }}
          restore-keys: |
            bazel-macos-arm64-
          
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_macos.universal.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_macos.universal.zip
          chmod +x Godot.app/Contents/MacOS/Godot
          ./Godot.app/Contents/MacOS/Godot --headless --dump-extension-api
          
      - name: Setup GDMP
        working-directory: GDMP
        run: |
          python3 setup.py --api-json ../extension_api.json --no-download || true
          
      - name: Build GDMP
        working-directory: GDMP
        run: |
          python3 build.py desktop --type release --output build/macos-arm64
          
      - name: Verify build
        run: |
          ls -lh GDMP/build/macos-arm64/
          file GDMP/build/macos-arm64/libGDMP.macos.dylib
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdmp-macos-arm64
          path: GDMP/build/macos-arm64/libGDMP.macos.dylib
          retention-days: 30

  # Build GDMP for Android (arm64-v8a)
  build-android-arm64:
    name: Build GDMP Android (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GDMP
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GDMP_REPO }}
          ref: ${{ env.GDMP_REF }}
          submodules: recursive
          path: GDMP
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          
      - name: Install Bazelisk
        run: |
          wget -q https://github.com/bazelbuild/bazelisk/releases/download/v1.19.0/bazelisk-linux-amd64
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel
          bazel --version
          
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            GDMP/.bazelcache
          key: bazel-android-arm64-${{ hashFiles('GDMP/WORKSPACE', 'GDMP/BUILD.bazel') }}
          restore-keys: |
            bazel-android-arm64-
          
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --dump-extension-api
          
      - name: Setup GDMP
        working-directory: GDMP
        run: |
          python3 setup.py --api-json ../extension_api.json --no-download || true
          
      - name: Build GDMP for Android arm64-v8a
        working-directory: GDMP
        run: |
          python3 build.py android --type release --arch arm64 --output build/android-arm64
          
      - name: Verify build
        run: |
          ls -lh GDMP/build/android-arm64/
          file GDMP/build/android-arm64/libGDMP.android.so
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdmp-android-arm64
          path: GDMP/build/android-arm64/libGDMP.android.so
          retention-days: 30

  # Build GDMP for Android (x86_64)
  build-android-x86_64:
    name: Build GDMP Android (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GDMP
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GDMP_REPO }}
          ref: ${{ env.GDMP_REF }}
          submodules: recursive
          path: GDMP
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          
      - name: Install Bazelisk
        run: |
          wget -q https://github.com/bazelbuild/bazelisk/releases/download/v1.19.0/bazelisk-linux-amd64
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel
          bazel --version
          
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            GDMP/.bazelcache
          key: bazel-android-x86_64-${{ hashFiles('GDMP/WORKSPACE', 'GDMP/BUILD.bazel') }}
          restore-keys: |
            bazel-android-x86_64-
          
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --dump-extension-api
          
      - name: Setup GDMP
        working-directory: GDMP
        run: |
          python3 setup.py --api-json ../extension_api.json --no-download || true
          
      - name: Build GDMP for Android x86_64
        working-directory: GDMP
        run: |
          python3 build.py android --type release --arch x86_64 --output build/android-x86_64
          
      - name: Verify build
        run: |
          ls -lh GDMP/build/android-x86_64/
          file GDMP/build/android-x86_64/libGDMP.android.so
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdmp-android-x86_64
          path: GDMP/build/android-x86_64/libGDMP.android.so
          retention-days: 30

  # Build GDMP for Web (wasm32)
  build-web:
    name: Build GDMP Web (wasm32)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GDMP
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GDMP_REPO }}
          ref: ${{ env.GDMP_REF }}
          submodules: recursive
          path: GDMP
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh
          echo "EMSDK=$(pwd)" >> $GITHUB_ENV
          
      - name: Install Bazelisk
        run: |
          wget -q https://github.com/bazelbuild/bazelisk/releases/download/v1.19.0/bazelisk-linux-amd64
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel
          bazel --version
          
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            GDMP/.bazelcache
          key: bazel-web-${{ hashFiles('GDMP/WORKSPACE', 'GDMP/BUILD.bazel') }}
          restore-keys: |
            bazel-web-
          
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --dump-extension-api
          
      - name: Setup GDMP
        working-directory: GDMP
        run: |
          source ../emsdk/emsdk_env.sh
          python3 setup.py --api-json ../extension_api.json --no-download || true
          
      - name: Build GDMP for Web
        working-directory: GDMP
        run: |
          source ../emsdk/emsdk_env.sh
          python3 build.py web --type release --output build/web
          
      - name: Verify build
        run: |
          ls -lh GDMP/build/web/
          file GDMP/build/web/GDMP.web.wasm
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdmp-web
          path: GDMP/build/web/GDMP.web.wasm
          retention-days: 30

  # Collect all built libraries
  collect-gdmp-libraries:
    name: Collect GDMP Libraries
    runs-on: ubuntu-latest
    needs: 
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows-x86_64
      - build-macos-x86_64
      - build-macos-arm64
      - build-android-arm64
      - build-android-x86_64
      - build-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Download all GDMP artifacts
        uses: actions/download-artifact@v4
        with:
          path: gdmp-builds
          
      - name: Organize libraries
        run: |
          mkdir -p addons/GDMP/libs/x86_64
          mkdir -p addons/GDMP/libs/arm64
          mkdir -p addons/GDMP/libs
          
          # Linux
          cp gdmp-builds/gdmp-linux-x86_64/libGDMP.linux.so addons/GDMP/libs/x86_64/
          cp gdmp-builds/gdmp-linux-arm64/libGDMP.linux.so addons/GDMP/libs/arm64/
          
          # Windows
          cp gdmp-builds/gdmp-windows-x86_64/GDMP.windows.dll addons/GDMP/libs/x86_64/
          
          # macOS
          cp gdmp-builds/gdmp-macos-x86_64/libGDMP.macos.dylib addons/GDMP/libs/x86_64/
          cp gdmp-builds/gdmp-macos-arm64/libGDMP.macos.dylib addons/GDMP/libs/arm64/
          
          # Android
          cp gdmp-builds/gdmp-android-arm64/libGDMP.android.so addons/GDMP/libs/arm64/
          cp gdmp-builds/gdmp-android-x86_64/libGDMP.android.so addons/GDMP/libs/x86_64/
          
          # Web
          cp gdmp-builds/gdmp-web/GDMP.web.wasm addons/GDMP/libs/
          
      - name: List all libraries
        run: |
          echo "## GDMP Libraries Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Linux" >> $GITHUB_STEP_SUMMARY
          ls -lh addons/GDMP/libs/x86_64/libGDMP.linux.so >> $GITHUB_STEP_SUMMARY
          ls -lh addons/GDMP/libs/arm64/libGDMP.linux.so >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Windows" >> $GITHUB_STEP_SUMMARY
          ls -lh addons/GDMP/libs/x86_64/GDMP.windows.dll >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### macOS" >> $GITHUB_STEP_SUMMARY
          ls -lh addons/GDMP/libs/x86_64/libGDMP.macos.dylib >> $GITHUB_STEP_SUMMARY
          ls -lh addons/GDMP/libs/arm64/libGDMP.macos.dylib >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Android" >> $GITHUB_STEP_SUMMARY
          ls -lh addons/GDMP/libs/arm64/libGDMP.android.so >> $GITHUB_STEP_SUMMARY
          ls -lh addons/GDMP/libs/x86_64/libGDMP.android.so >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Web" >> $GITHUB_STEP_SUMMARY
          ls -lh addons/GDMP/libs/GDMP.web.wasm >> $GITHUB_STEP_SUMMARY
          
      - name: Upload complete GDMP addon
        uses: actions/upload-artifact@v4
        with:
          name: gdmp-addon-complete
          path: addons/GDMP/
          retention-days: 90
          
      - name: Create library archive
        run: |
          tar -czf gdmp-libraries-all-platforms.tar.gz -C addons GDMP/libs
          
      - name: Upload library archive
        uses: actions/upload-artifact@v4
        with:
          name: gdmp-libraries-archive
          path: gdmp-libraries-all-platforms.tar.gz
          retention-days: 90
