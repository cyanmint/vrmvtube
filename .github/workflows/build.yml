          echo "✓ macOS build completed"
          echo "Build includes GDMP addon with MediaPipe - fully self-contained!"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: builds/macos

  export-web:
    name: Web Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Download and Setup GDMP
        run: |
          echo "Setting up GDMP for Web..."
          
          # Download unified GDMP release (contains all platforms)
          wget -q https://github.com/j20001970/GDMP/releases/download/${GDMP_VERSION}/GDMP-${GDMP_VERSION}.zip
          
          # Extract to current directory - force overwrite to avoid prompts
          unzip -o -q GDMP-${GDMP_VERSION}.zip
          
          # Download MediaPipe face landmarker model
          mkdir -p addons/GDMP/models
          wget -q -O addons/GDMP/models/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
          
          echo "✓ GDMP binaries installed (all platforms)"
          echo "✓ MediaPipe model downloaded"
          echo "Web WASM:"
          ls -lh addons/GDMP/libs/GDMP.web.wasm 2>/dev/null || echo "Web WASM not found"
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip libfontconfig1 libfreetype6 libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1 libgles2-mesa-dev libegl1-mesa-dev
      
