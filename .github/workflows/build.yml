name: Build VRMVTube

on:
  push:
    branches: [ default, develop ]
  pull_request:
    branches: [ default ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6-stable
  EXPORT_NAME: VRMVTube

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip libfontconfig1 libfreetype6 libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1
      
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
        working-directory: /tmp
      
      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          mv templates/* ~/.local/share/godot/export_templates/4.6.stable/
        working-directory: /tmp
      
      - name: Import Resources
        run: godot --headless --verbose --editor --quit
      
      - name: Build Windows
        run: |
          mkdir -p builds/windows
          godot --headless --verbose --export-release "Windows" builds/windows/${EXPORT_NAME}.exe
      
      - name: Include Python Tools
        run: |
          mkdir -p builds/windows/tools
          cp -r tools/*.py builds/windows/tools/ || true
          cp tools/requirements.txt builds/windows/tools/ || true
          cp tools/README.md builds/windows/tools/ || true
          echo "Python tools included in Windows build"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: builds/windows

  export-linux:
    name: Linux Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip libfontconfig1 libfreetype6 libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1
      
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
        working-directory: /tmp
      
      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          mv templates/* ~/.local/share/godot/export_templates/4.6.stable/
        working-directory: /tmp
      
      - name: Import Resources
        run: godot --headless --verbose --editor --quit
      
      - name: Build Linux
        run: |
          mkdir -p builds/linux
          godot --headless --verbose --export-release "Linux" builds/linux/${EXPORT_NAME}.x86_64
      
      - name: Include Python Tools
        run: |
          mkdir -p builds/linux/tools
          cp -r tools/*.py builds/linux/tools/ || true
          cp tools/requirements.txt builds/linux/tools/ || true
          cp tools/README.md builds/linux/tools/ || true
          chmod +x builds/linux/tools/*.py || true
          echo "Python tools included in Linux build"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: builds/linux

  export-macos:
    name: macOS Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip libfontconfig1 libfreetype6 libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1
      
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
        working-directory: /tmp
      
      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          mv templates/* ~/.local/share/godot/export_templates/4.6.stable/
        working-directory: /tmp
      
      - name: Import Resources
        run: godot --headless --verbose --editor --quit
      
      - name: Build macOS
        run: |
          mkdir -p builds/macos
          godot --headless --verbose --export-release "macOS" builds/macos/${EXPORT_NAME}.zip
      
      - name: Include Python Tools
        run: |
          mkdir -p builds/macos/tools
          cp -r tools/*.py builds/macos/tools/ || true
          cp tools/requirements.txt builds/macos/tools/ || true
          cp tools/README.md builds/macos/tools/ || true
          echo "Python tools included in macOS build"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: builds/macos

  export-web:
    name: Web Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip libfontconfig1 libfreetype6 libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1
      
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
        working-directory: /tmp
      
      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          mv templates/* ~/.local/share/godot/export_templates/4.6.stable/
        working-directory: /tmp
      
      - name: Import Resources
        run: godot --headless --verbose --editor --quit
      
      - name: Build Web
        run: |
          mkdir -p builds/web
          godot --headless --verbose --export-release "Web" builds/web/index.html
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: builds/web

  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip libfontconfig1 libfreetype6 libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1
      
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
        working-directory: /tmp
      
      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          mv templates/* ~/.local/share/godot/export_templates/4.6.stable/
        working-directory: /tmp
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2 ndk;23.2.8568313'
      
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
      
      - name: Create Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "✓ Debug keystore created"
          else
            echo "✓ Debug keystore already exists"
          fi
      
      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          export/android/one_click_deploy_clear_previous_install = false
          EOF
      
      - name: Import Resources
        run: |
          echo "Importing project resources..."
          godot --headless --verbose --editor --quit
          echo "✓ Import completed"
      
      - name: Build Android
        run: |
          mkdir -p builds/android
          echo "Starting Android export..."
          echo "Using export preset: Android"
          echo "Target path: builds/android/VRMVTube.apk"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "Java version:"
          java -version
          
          # Run export with detailed output
          godot --headless --verbose --export-debug "Android" builds/android/VRMVTube.apk 2>&1 | tee android_export.log
          
          # Capture export result
          export_result=$?
          
          # Show the last 50 lines of output for debugging
          echo ""
          echo "=== Last 50 lines of export output ==="
          tail -n 50 android_export.log || true
          
          echo ""
          echo "Export command completed with exit code: $export_result"
          
          # Check what files were created
          echo ""
          echo "=== Files in builds/android ==="
          ls -lah builds/android/ || echo "Directory is empty or doesn't exist"
          
          # Exit with same code as godot export
          exit $export_result
      
      - name: Verify APK
        run: |
          echo "Checking builds/android directory..."
          ls -lah builds/android/ || echo "Directory not found"
          
          # Check for APK file (might have different name than expected)
          if [ -f "builds/android/VRMVTube.apk" ]; then
            echo "✓ APK file created successfully"
            echo "  Size: $(du -h builds/android/VRMVTube.apk | cut -f1)"
          else
            echo "✗ Expected APK file (VRMVTube.apk) was not created"
            echo ""
            echo "Looking for any APK files..."
            find builds/android -name "*.apk" -exec ls -lh {} \; || echo "No APK files found"
            echo ""
            echo "Contents of builds directory:"
            find builds -type f || echo "No files found"
            echo ""
            echo "Checking export log for errors..."
            grep -i "error\|fail\|warning" android_export.log | tail -n 20 || echo "No errors found in log"
            exit 1
          fi
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android
          path: builds/android/VRMVTube.apk
      
      - name: Upload Export Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-export-log
          path: android_export.log
