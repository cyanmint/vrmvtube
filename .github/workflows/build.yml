name: Build Multi-Platform

# CI/CD workflow to build VRMVTube for all supported platforms
# Based on Godot 4.6 stable - without Docker containers

on:
  push:
    branches: [ default, develop ]
  pull_request:
    branches: [ default ]
  release:
    types: [ created ]

env:
  GODOT_VERSION: "4.6-stable"
  GODOT_TEMPLATES_VERSION: "4.6.stable"
  EXPORT_NAME: vrmvtube

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          mkdir -p $HOME/.local/bin
          mv Godot_v${GODOT_VERSION}_linux.x86_64 $HOME/.local/bin/godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p $HOME/.local/share/godot/export_templates
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates $HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_VERSION}
          
      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          godot --headless --verbose --export-release "Windows Desktop" ./build/windows/$EXPORT_NAME.exe
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows

  export-linux:
    name: Linux Export  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          mkdir -p $HOME/.local/bin
          mv Godot_v${GODOT_VERSION}_linux.x86_64 $HOME/.local/bin/godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p $HOME/.local/share/godot/export_templates
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates $HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_VERSION}
          
      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          godot --headless --verbose --export-release "Linux/X11" ./build/linux/$EXPORT_NAME.x86_64
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux

  export-web:
    name: Web Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          mkdir -p $HOME/.local/bin
          mv Godot_v${GODOT_VERSION}_linux.x86_64 $HOME/.local/bin/godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p $HOME/.local/share/godot/export_templates
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates $HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_VERSION}
          
      - name: Web Build
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" ./build/web/index.html
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

  export-mac:
    name: Mac Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          mkdir -p $HOME/.local/bin
          mv Godot_v${GODOT_VERSION}_linux.x86_64 $HOME/.local/bin/godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p $HOME/.local/share/godot/export_templates
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates $HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_VERSION}
          
      - name: Mac Build
        run: |
          mkdir -v -p build/mac
          godot --headless --verbose --export-release "macOS" ./build/mac/$EXPORT_NAME.zip
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/mac

  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          mkdir -p $HOME/.local/bin
          mv Godot_v${GODOT_VERSION}_linux.x86_64 $HOME/.local/bin/godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p $HOME/.local/share/godot/export_templates
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates $HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_VERSION}
      
      - name: Android Build
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" ./build/android/$EXPORT_NAME.apk
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/android
