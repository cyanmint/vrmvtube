name: Build VRMVTube (Simple)

# Simplified build workflow that uses prebuilt GDMP libraries
# This is more reliable and much faster than building GDMP from source

on:
  push:
    branches: [ default ]
  pull_request:
    branches: [ default ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6-stable"
  EXPORT_NAME: vrmvtube

jobs:
  # Download MediaPipe models (cached)
  download-models:
    name: Download MediaPipe Models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Cache MediaPipe models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: assets/models/mediapipe
          key: mediapipe-models-v1
          
      - name: Download Hand Landmarker
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p assets/models/mediapipe
          curl -L -o assets/models/mediapipe/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
            
      - name: Download Face Landmarker
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          curl -L -o assets/models/mediapipe/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
            
      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-models
          path: assets/models/mediapipe/*.task
          retention-days: 7

  # Export Windows
  export-windows:
    name: Export Windows
    runs-on: ubuntu-latest
    needs: [download-models]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download models
        uses: actions/download-artifact@v4
        with:
          name: mediapipe-models
          path: assets/models/mediapipe
          
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          
      - name: Download export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}
          unzip -q Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}/
          
      - name: Import project
        timeout-minutes: 10
        run: ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --editor --path . --quit-after 5 || true
          
      - name: Export Windows
        timeout-minutes: 10
        run: |
          mkdir -p builds/windows
          ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --export-release "Windows Desktop" builds/windows/${{ env.EXPORT_NAME }}.exe || true
          ls -lah builds/windows/ || true
          
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrmvtube-windows
          path: builds/windows/
          retention-days: 14
          if-no-files-found: warn

  # Export Linux
  export-linux:
    name: Export Linux
    runs-on: ubuntu-latest
    needs: [download-models]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download models
        uses: actions/download-artifact@v4
        with:
          name: mediapipe-models
          path: assets/models/mediapipe
          
      - name: Set GDMP library permissions
        run: |
          chmod +x addons/GDMP/libs/x86_64/libGDMP.linux.so || true
          chmod +x addons/GDMP/libs/arm64/libGDMP.linux.so || true
          
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          
      - name: Download export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}
          unzip -q Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}/
          
      - name: Import project
        timeout-minutes: 10
        run: ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --editor --path . --quit-after 5 || true
          
      - name: Export Linux
        timeout-minutes: 10
        run: |
          mkdir -p builds/linux
          ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --export-release "Linux/X11" builds/linux/${{ env.EXPORT_NAME }}.x86_64 || true
          chmod +x builds/linux/${{ env.EXPORT_NAME }}.x86_64 || true
          ls -lah builds/linux/ || true
          
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrmvtube-linux
          path: builds/linux/
          retention-days: 14
          if-no-files-found: warn

  # Export Web
  export-web:
    name: Export Web
    runs-on: ubuntu-latest
    needs: [download-models]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download models
        uses: actions/download-artifact@v4
        with:
          name: mediapipe-models
          path: assets/models/mediapipe
          
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          
      - name: Download export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}
          unzip -q Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}/
          
      - name: Import project
        timeout-minutes: 10
        run: ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --editor --path . --quit-after 5 || true
          
      - name: Export Web
        timeout-minutes: 10
        run: |
          mkdir -p builds/web
          ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --export-release "Web" builds/web/index.html || true
          ls -lah builds/web/ || true
          
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrmvtube-web
          path: builds/web/
          retention-days: 14
          if-no-files-found: warn
