  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip libfontconfig1 libfreetype6 libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1
      
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
        working-directory: /tmp
      
      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          mv templates/* ~/.local/share/godot/export_templates/4.6.stable/
        working-directory: /tmp
      
      - name: Install Android Build Template
        run: |
          # Extract Android build template from export templates
          mkdir -p android/build
          if [ -f ~/.local/share/godot/export_templates/4.6.stable/android_source.zip ]; then
            unzip -q ~/.local/share/godot/export_templates/4.6.stable/android_source.zip -d android/build/
            echo "✓ Android source template extracted"
          else
            echo "✗ android_source.zip not found in export templates"
            ls -la ~/.local/share/godot/export_templates/4.6.stable/
            exit 1
          fi
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2 ndk;23.2.8568313 cmake;3.22.1'
      
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
      
      - name: Create Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "✓ Debug keystore created"
          else
            echo "✓ Debug keystore already exists"
          fi
      
      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          export/android/one_click_deploy_clear_previous_install = false
          EOF
      
      - name: Import Resources
        run: |
          echo "Importing project resources..."
          godot --headless --verbose --editor --quit
          echo "✓ Import completed"
      
      - name: Build Android
        run: |
          mkdir -p builds/android
          echo "Starting Android export..."
          godot --headless --verbose --export-debug "Android" builds/android/${EXPORT_NAME}.apk
          echo "Export command completed"
      
      - name: Verify APK
        run: |
          echo "Checking builds/android directory..."
          ls -lah builds/android/ || echo "Directory not found"
          if [ -f "builds/android/${EXPORT_NAME}.apk" ]; then
            echo "✓ APK file created successfully"
            echo "  Size: $(du -h builds/android/${EXPORT_NAME}.apk | cut -f1)"
          else
            echo "✗ APK file was not created"
            echo "Contents of builds directory:"
            find builds -type f || echo "No files found"
            exit 1
          fi
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android
          path: builds/android/${EXPORT_NAME}.apk
