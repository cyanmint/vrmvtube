          echo "✓ MediaPipe model downloaded"
          echo "Linux library:"
          ls -lh addons/GDMP/libs/x86_64/libGDMP.linux.so 2>/dev/null || echo "Linux .so not found"
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip libfontconfig1 libfreetype6 libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1 libgles2-mesa-dev libegl1-mesa-dev
      
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
        working-directory: /tmp
      
      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          mv templates/* ~/.local/share/godot/export_templates/4.6.stable/
        working-directory: /tmp
      
      - name: Import Resources
        run: godot --headless --verbose --editor --quit
      
      - name: Build Linux
        run: |
          mkdir -p builds/linux
          godot --headless --verbose --export-release "Linux" builds/linux/${EXPORT_NAME}.x86_64
          echo "✓ Linux build completed"
          echo "Build includes GDMP addon with MediaPipe - fully self-contained!"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: builds/linux

