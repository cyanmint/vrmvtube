name: Build VRMVTube

on:
  push:
    branches: [ default, develop ]
  pull_request:
    branches: [ default ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6-stable

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          # The container has templates at /root/.local/share/godot/export_templates/4.6-stable
          # but Godot expects them at 4.6.stable (dot instead of hyphen)
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}" ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION} ~/.local/share/godot/export_templates/4.6.stable
          fi
      
      - name: Import resources
        run: |
          godot --headless --verbose --editor --quit
      
      - name: Windows Build
        run: |
          mkdir -v -p builds/windows
          godot --headless --verbose --export-release "Windows" ./builds/windows/VRMVTube.exe
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: builds/windows

  export-linux:
    name: Linux Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}" ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION} ~/.local/share/godot/export_templates/4.6.stable
          fi
      
      - name: Import resources
        run: |
          godot --headless --verbose --editor --quit
      
      - name: Linux Build
        run: |
          mkdir -v -p builds/linux
          godot --headless --verbose --export-release "Linux" ./builds/linux/VRMVTube.x86_64
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: builds/linux

  export-macos:
    name: macOS Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}" ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION} ~/.local/share/godot/export_templates/4.6.stable
          fi
      
      - name: Import resources
        run: |
          godot --headless --verbose --editor --quit
      
      - name: macOS Build
        run: |
          mkdir -v -p builds/macos
          godot --headless --verbose --export-release "macOS" ./builds/macos/VRMVTube.zip
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: builds/macos

  export-web:
    name: Web Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}" ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION} ~/.local/share/godot/export_templates/4.6.stable
          fi
      
      - name: Import resources
        run: |
          godot --headless --verbose --editor --quit
      
      - name: Web Build
        run: |
          mkdir -v -p builds/web
          godot --headless --verbose --export-release "Web" ./builds/web/index.html
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: builds/web

  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}" ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION} ~/.local/share/godot/export_templates/4.6.stable
          fi
      
      - name: Setup Android SDK
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk wget unzip
          
          # Install Android SDK
          mkdir -p /root/android-sdk/cmdline-tools
          cd /root/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools latest
          
          # Accept licenses and install build tools
          yes | /root/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /root/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33" "cmdline-tools;latest" "cmake;3.22.1" "ndk;23.2.8568313"
          
          # Set environment variables for Godot
          export ANDROID_SDK_ROOT=/root/android-sdk
          export ANDROID_HOME=/root/android-sdk
      
      - name: Configure Godot Editor Settings for Android
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          
          [resource]
          export/android/android_sdk_path = "/root/android-sdk"
          export/android/debug_keystore = "/root/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          export/android/one_click_deploy_clear_previous_install = false
          EOF
          
          # Create debug keystore
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      
      - name: Import resources
        run: |
          godot --headless --verbose --editor --quit
      
      - name: Android Build
        run: |
          mkdir -v -p builds/android
          godot --headless --verbose --export-debug "Android" ./builds/android/VRMVTube.apk
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: builds/android
