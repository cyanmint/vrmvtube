name: Build VRMVTube

on:
  push:
    branches: [ default, develop ]
  pull_request:
    branches: [ default ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6-stable
  EXPORT_NAME: VRMVTube
  GDMP_VERSION: v0.6

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Download and Setup GDMP
        run: |
          echo "Setting up GDMP for Windows..."
          
          # Download unified GDMP release (contains all platforms)
          wget -q https://github.com/j20001970/GDMP/releases/download/${GDMP_VERSION}/GDMP-${GDMP_VERSION}.zip
          
          # Extract to current directory - force overwrite to avoid prompts
          unzip -o -q GDMP-${GDMP_VERSION}.zip
          
          # Download MediaPipe face landmarker model
          mkdir -p addons/GDMP/models
          wget -q -O addons/GDMP/models/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
          
          echo "✓ GDMP binaries installed (all platforms)"
          echo "✓ MediaPipe model downloaded"
          
          # Show structure
          echo "GDMP addon structure:"
          ls -la addons/GDMP/ || true
          echo "GDMP Windows libraries:"
          ls -lh addons/GDMP/libs/x86_64/GDMP.windows.dll 2>/dev/null || echo "Windows DLL not found"
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip libfontconfig1 libfreetype6 libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1 libgles2-mesa-dev libegl1-mesa-dev
      
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
        working-directory: /tmp
      
      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          mv templates/* ~/.local/share/godot/export_templates/4.6.stable/
        working-directory: /tmp
      
      - name: Install OpenGL Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev
      
      - name: Import Resources
        run: godot --headless --verbose --editor --quit
      
      - name: Build Windows
        run: |
          mkdir -p builds/windows
          godot --headless --verbose --export-release "Windows" builds/windows/${EXPORT_NAME}.exe
          echo "✓ Windows build completed"
          echo "Build includes GDMP addon with MediaPipe - fully self-contained!"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: builds/windows

