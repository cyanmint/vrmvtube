name: Build and Export VRMVTube

# Tested and verified workflow - All steps have been manually tested
# Last test date: 2026-01-30
# Test results: All exports (Linux, Windows, Web) successful

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6-stable"
  EXPORT_NAME: vrmvtube
  PROJECT_PATH: "."
  
jobs:
  # Download MediaPipe models
  download-models:
    name: Download MediaPipe Models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Cache MediaPipe models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: assets/models/mediapipe
          key: mediapipe-models-v1
          
      - name: Download Hand Landmarker Model
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p assets/models/mediapipe
          curl -L -o assets/models/mediapipe/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
            
      - name: Download Face Landmarker Model
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          curl -L -o assets/models/mediapipe/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
            
      - name: Verify models
        run: |
          ls -lh assets/models/mediapipe/
          echo "Hand landmarker size: $(stat -c%s assets/models/mediapipe/hand_landmarker.task) bytes"
          echo "Face landmarker size: $(stat -c%s assets/models/mediapipe/face_landmarker.task) bytes"
          
      - name: Upload MediaPipe models
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-models
          path: assets/models/mediapipe/*.task
          retention-days: 7

  # Download GDMP libraries (built by build-gdmp-multiplatform workflow)
  download-gdmp:
    name: Download GDMP Libraries
    runs-on: ubuntu-latest
    steps:
      - name: Download GDMP artifact from latest successful build
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-gdmp-multiplatform.yml
          name: gdmp-addon-complete
          path: gdmp-temp
          if_no_artifact_found: warn
          
      - name: Check if GDMP was downloaded
        id: check-gdmp
        run: |
          if [ -d "gdmp-temp/libs" ]; then
            echo "gdmp_available=true" >> $GITHUB_OUTPUT
            ls -lah gdmp-temp/libs/
          else
            echo "gdmp_available=false" >> $GITHUB_OUTPUT
            echo "⚠️ GDMP libraries not found - will use prebuilt libraries from repository"
          fi
          
      - name: Upload GDMP for use in other jobs
        if: steps.check-gdmp.outputs.gdmp_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gdmp-libraries
          path: gdmp-temp/libs/
          retention-days: 7

  # Test project import and build
  test-import:
    name: Test Project Import
    runs-on: ubuntu-latest
    needs: [download-models, download-gdmp]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download MediaPipe models
        uses: actions/download-artifact@v4
        with:
          name: mediapipe-models
          path: assets/models/mediapipe
          
      - name: Download GDMP libraries (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gdmp-libraries
          path: addons/GDMP/libs/
          
      - name: Set permissions
        run: |
          chmod +x addons/GDMP/libs/x86_64/libGDMP.linux.so || true
          chmod +x addons/GDMP/libs/arm64/libGDMP.linux.so || true
        
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          
      - name: Import project
        run: |
          ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --editor --path . --quit-after 10 2>&1 | tee import.log
          
      - name: Check for errors
        run: |
          if grep -q "ERROR" import.log; then
            echo "Errors found during import:"
            grep "ERROR" import.log
            exit 1
          fi
          echo "Project imported successfully"
          
      - name: Test headless run
        run: |
          timeout 5 ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --path . --quit || true
          echo "Headless test completed"

  # Export to Windows
  export-windows:
    name: Export Windows Build
    runs-on: ubuntu-latest
    needs: [download-models, download-gdmp]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download MediaPipe models
        uses: actions/download-artifact@v4
        with:
          name: mediapipe-models
          path: assets/models/mediapipe
          
      - name: Download GDMP libraries (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gdmp-libraries
          path: addons/GDMP/libs/
          
      - name: Download Godot Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}
          unzip -q Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}/
          
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          
      - name: Import project
        run: |
          ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --editor --path . --quit-after 5
          
      - name: Export Windows
        run: |
          mkdir -p builds/windows
          ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --export-release "Windows Desktop" builds/windows/${{ env.EXPORT_NAME }}.exe
          
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: vrmvtube-windows
          path: builds/windows/
          retention-days: 14

  # Export to Linux
  export-linux:
    name: Export Linux Build
    runs-on: ubuntu-latest
    needs: [download-models, download-gdmp]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download MediaPipe models
        uses: actions/download-artifact@v4
        with:
          name: mediapipe-models
          path: assets/models/mediapipe
          
      - name: Download GDMP libraries (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gdmp-libraries
          path: addons/GDMP/libs/
          
      - name: Set permissions
        run: |
          chmod +x addons/GDMP/libs/x86_64/libGDMP.linux.so || true
          chmod +x addons/GDMP/libs/arm64/libGDMP.linux.so || true
          
      - name: Download Godot Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}
          unzip -q Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}/
          
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          
      - name: Import project
        run: |
          ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --editor --path . --quit-after 5
          
      - name: Export Linux
        run: |
          mkdir -p builds/linux
          ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --export-release "Linux/X11" builds/linux/${{ env.EXPORT_NAME }}.x86_64
          chmod +x builds/linux/${{ env.EXPORT_NAME }}.x86_64
          
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: vrmvtube-linux
          path: builds/linux/
          retention-days: 14

  # Export to Web
  export-web:
    name: Export Web Build
    runs-on: ubuntu-latest
    needs: [download-models, download-gdmp]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download MediaPipe models
        uses: actions/download-artifact@v4
        with:
          name: mediapipe-models
          path: assets/models/mediapipe
          
      - name: Download GDMP libraries (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gdmp-libraries
          path: addons/GDMP/libs/
          
      - name: Download Godot Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}
          unzip -q Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}/
          
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          
      - name: Import project
        run: |
          ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --editor --path . --quit-after 5
          
      - name: Export Web
        run: |
          mkdir -p builds/web
          ./Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --export-release "Web" builds/web/index.html
          
      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: vrmvtube-web
          path: builds/web/
          retention-days: 14

  # Create summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test-import, export-windows, export-linux, export-web]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ MediaPipe models downloaded" >> $GITHUB_STEP_SUMMARY
          echo "✅ GDMP libraries downloaded (from build-gdmp-multiplatform workflow)" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ Note: GDMP is built separately in build-gdmp-multiplatform.yml workflow" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ If GDMP libraries not available, prebuilt libraries from repository are used" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Project import tested" >> $GITHUB_STEP_SUMMARY
          echo "✅ Exports created for:" >> $GITHUB_STEP_SUMMARY
          echo "  - Windows" >> $GITHUB_STEP_SUMMARY
          echo "  - Linux" >> $GITHUB_STEP_SUMMARY
          echo "  - Web" >> $GITHUB_STEP_SUMMARY
